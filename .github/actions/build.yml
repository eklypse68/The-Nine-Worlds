name: Nightly Release

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-latest
            platform: windows-x64

          - os: ubuntu-latest
            platform: linux-x64

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Linux dependencies
      # ------------------------------------------------------------

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxi-dev \
            libxext-dev \
            libxfixes-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev

      # ------------------------------------------------------------
      # Configure
      # ------------------------------------------------------------

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      # ------------------------------------------------------------
      # Package Windows
      # ------------------------------------------------------------

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package

          Copy-Item `
            "build/Release/TheNineWorlds.exe" `
            "package/TheNineWorlds.exe"

          if (Test-Path "assets") {
            Copy-Item `
              "assets" `
              "package/assets" `
              -Recurse
          }

          Compress-Archive `
            -Path "package/*" `
            -DestinationPath "TheNineWorlds-windows-x64.zip"

      # ------------------------------------------------------------
      # Package Linux
      # ------------------------------------------------------------

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package

          cp build/TheNineWorlds package/TheNineWorlds

          if [ -d "assets" ]; then
            cp -r assets package/assets
          fi

          chmod +x package/TheNineWorlds

          tar -czf \
            TheNineWorlds-linux-x64.tar.gz \
            -C package .

      # ------------------------------------------------------------
      # Upload temporary CI artifacts
      # ------------------------------------------------------------

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: TheNineWorlds-windows-x64.zip
          retention-days: 1

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: TheNineWorlds-linux-x64.tar.gz
          retention-days: 1

  # ================================================================
  # NIGHTLY RELEASE
  # ================================================================

  release:
    name: Update Nightly Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Download builds
      # ------------------------------------------------------------

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release

      # ------------------------------------------------------------
      # Delete existing Nightly release
      # ------------------------------------------------------------

      - name: Delete existing Nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly \
            --repo "${{ github.repository }}" \
            --yes \
            || true

      # ------------------------------------------------------------
      # Delete existing Nightly tag
      # ------------------------------------------------------------

      - name: Delete existing Nightly tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push \
            origin \
            --delete nightly \
            || true

      # ------------------------------------------------------------
      # Create fresh Nightly release
      # ------------------------------------------------------------

      - name: Create Nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly \
            release/TheNineWorlds-windows-x64.zip \
            release/TheNineWorlds-linux-x64.tar.gz \
            --repo "${{ github.repository }}" \
            --title "Nightly" \
            --prerelease \
            --latest=false \
            --target "${{ github.sha }}" \
            --notes "$(cat <<'EOF'
          ## TheNineWorlds Nightly

          Automatically generated development build from the latest `main` commit.

          **This build may contain unfinished features, bugs, crashes, or breaking changes.**

          Commit: `${{ github.sha }}`

          ### Downloads

          - **Windows x64** — `TheNineWorlds-windows-x64.zip`
          - **Linux x64** — `TheNineWorlds-linux-x64.tar.gz`
          EOF
          )"